<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>JVC Chileras · Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    input[type="email"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      background: #000;
      color: var(--blanco);
      border: 1px solid #555;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .barra {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pestana {
      background: none;
      border: 2px solid var(--naranja);
      color: var(--naranja);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .pestana.activa {
      background: var(--naranja);
      color: #000;
      font-weight: bold;
    }

    .pedido {
      max-width: 560px;
      margin: 0 auto 16px;
      background: var(--tarjeta);
      border-radius: 10px;
      padding: 16px;
      border-bottom: 4px solid var(--naranja);
    }

    .pedido-cab {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .pedido-cab span {
      color: #bbb;
      font-size: 14px;
    }

    .etiqueta-pago {
      display: inline-block;
      margin: 0 0 8px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .etiqueta-pago.sinpe {
      background: rgba(46, 125, 50, 0.25);
      color: #8fe19a;
      border: 1px solid #2e7d32;
    }

    .etiqueta-pago.efectivo {
      background: rgba(245, 197, 24, 0.18);
      color: var(--amarillo);
      border: 1px solid var(--amarillo);
    }

    .comprobante {
      display: block;
      max-width: 100%;
      max-height: 260px;
      margin: 12px auto 0;
      border-radius: 8px;
      border: 1px solid #555;
    }

    .acciones {
      text-align: center;
      margin-top: 12px;
    }

    .atender {
      background: #2e7d32;
      color: var(--blanco);
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .atender.reabrir {
      background: #555;
    }

    .atender:disabled {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>JVC Chileras · Admin</h1>
  </header>

  <main>
    <!-- Acceso del administrador -->
    <section id="vista-login" class="oculto">
      <h2>Acceso del administrador</h2>
      <div class="recuadro-unico">
        <form id="form-login">
          <input type="email" id="correo" placeholder="Correo" autocomplete="username">
          <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
          <p id="error-login" class="error oculto"></p>
          <button type="submit" class="btn-chile btn-grande">Entrar</button>
        </form>
      </div>
    </section>

    <!-- Panel de pedidos -->
    <section id="vista-panel" class="oculto">
      <h2>Pedidos</h2>

      <div class="barra">
        <button class="pestana activa" id="pestana-pendientes">Pendientes</button>
        <button class="pestana" id="pestana-atendidos">Atendidos</button>
        <button class="volver" id="actualizar">Actualizar</button>
        <button class="volver" id="cerrar-sesion">Cerrar sesión</button>
      </div>

      <p id="estado-lista" class="vacio"></p>
      <div id="lista-pedidos"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Configuración ----------
    const SUPABASE_URL = "https://mpqepqoiuwfvpabhnktz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wcWVwcW9pdXdmdnBhYmhua3R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTU2NjAsImV4cCI6MjEwNzQ5MTY2MH0.9hPfyHaeDQUOBVVSPcIv8oNqM0oHlgWgDxQuQpQOdyQ";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let pestanaActual = "pendiente";

    // ---------- Utilidades ----------
    function el(id) {
      return document.getElementById(id);
    }

    function dinero(n) {
      return "₡" + Number(n).toLocaleString("es-CR");
    }

    // Evita que un texto escrito por un cliente se interprete como código
    function escapar(texto) {
      const d = document.createElement("div");
      d.textContent = texto == null ? "" : String(texto);
      return d.innerHTML;
    }

    function mostrarLogin() {
      el("vista-login").classList.remove("oculto");
      el("vista-panel").classList.add("oculto");
    }

    function mostrarPanel() {
      el("vista-login").classList.add("oculto");
      el("vista-panel").classList.remove("oculto");
      cargarPedidos();
    }

    // ---------- Acceso ----------
    el("form-login").addEventListener("submit", async function (e) {
      e.preventDefault();
      const error = el("error-login");
      error.classList.add("oculto");

      const res = await db.auth.signInWithPassword({
        email: el("correo").value.trim(),
        password: el("clave").value
      });

      if (res.error) {
        error.textContent = "Correo o contraseña incorrectos.";
        error.classList.remove("oculto");
        return;
      }
      el("clave").value = "";
      mostrarPanel();
    });

    el("cerrar-sesion").addEventListener("click", async function () {
      await db.auth.signOut();
      el("lista-pedidos").innerHTML = "";
      mostrarLogin();
    });

    // ---------- Pestañas ----------
    function cambiarPestana(estado) {
      pestanaActual = estado;
      el("pestana-pendientes").classList.toggle("activa", estado === "pendiente");
      el("pestana-atendidos").classList.toggle("activa", estado === "atendido");
      cargarPedidos();
    }

    el("pestana-pendientes").addEventListener("click", function () { cambiarPestana("pendiente"); });
    el("pestana-atendidos").addEventListener("click", function () { cambiarPestana("atendido"); });
    el("actualizar").addEventListener("click", cargarPedidos);

    // ---------- Pedidos ----------
    async function cargarPedidos() {
      const lista = el("lista-pedidos");
      const info = el("estado-lista");
      info.textContent = "Cargando...";

      const res = await db
        .from("pedidos")
        .select("*")
        .eq("estado", pestanaActual)
        .order("creado_en", { ascending: false });

      if (res.error) {
        console.error(res.error);
        info.textContent = "No se pudieron cargar los pedidos.";
        lista.innerHTML = "";
        return;
      }

      const pedidos = res.data;
      if (pedidos.length === 0) {
        info.textContent = pestanaActual === "pendiente" ? "No hay pedidos pendientes." : "No hay pedidos atendidos.";
        lista.innerHTML = "";
        return;
      }
      info.textContent = pedidos.length + (pedidos.length === 1 ? " pedido" : " pedidos");

      // Enlaces temporales para ver las fotos de los comprobantes (carpeta privada)
      const urls = {};
      const rutas = pedidos.map(function (p) { return p.comprobante; }).filter(Boolean);
      if (rutas.length > 0) {
        const firmadas = await db.storage.from("comprobantes").createSignedUrls(rutas, 3600);
        if (!firmadas.error) {
          firmadas.data.forEach(function (f) {
            if (f.signedUrl) urls[f.path] = f.signedUrl;
          });
        }
      }

      lista.innerHTML = pedidos.map(function (p) {
        const fecha = new Date(p.creado_en).toLocaleString("es-CR", {
          timeZone: "America/Costa_Rica",
          dateStyle: "short",
          timeStyle: "short"
        });

        const efectivo = p.metodo_pago === "efectivo";

        const items = (p.items || []).map(function (it) {
          return `
            <div class="item">
              <div>
                <strong>${escapar(it.nombre)}</strong><br>
                <small>Picor: ${escapar(it.picor)}${it.nota ? " · Nota: " + escapar(it.nota) : ""}</small>
              </div>
              <div class="item-der">${dinero(it.precio)}</div>
            </div>`;
        }).join("");

        const url = urls[p.comprobante];
        let imagen;
        if (efectivo) {
          imagen = `<p class="vacio">Pago en efectivo: no hay comprobante</p>`;
        } else if (url) {
          imagen = `<a href="${url}" target="_blank" rel="noopener"><img class="comprobante" src="${url}" alt="Comprobante de pago"></a>`;
        } else {
          imagen = `<p class="vacio">Sin imagen de comprobante</p>`;
        }

        const boton = pestanaActual === "pendiente"
          ? `<button class="atender" data-id="${escapar(p.id)}" data-nuevo="atendido">Marcar como atendido</button>`
          : `<button class="atender reabrir" data-id="${escapar(p.id)}" data-nuevo="pendiente">Volver a pendiente</button>`;

        return `
          <article class="pedido">
            <div class="pedido-cab">
              <strong>${escapar(p.cliente)}</strong>
              <span>${escapar(fecha)}</span>
            </div>
            <p class="etiqueta-pago ${efectivo ? "efectivo" : "sinpe"}">${efectivo ? "Pago en efectivo" : "Pago por SINPE Móvil"}</p>
            ${items}
            <p class="total-grande">Total: ${dinero(p.total)}</p>
            ${imagen}
            <div class="acciones">${boton}</div>
          </article>`;
      }).join("");
    }

    el("lista-pedidos").addEventListener("click", async function (e) {
      const boton = e.target.closest(".atender");
      if (!boton) return;

      boton.disabled = true;
      const res = await db.from("pedidos").update({ estado: boton.dataset.nuevo }).eq("id", boton.dataset.id);
      if (res.error) {
        console.error(res.error);
        alert("No se pudo actualizar el pedido.");
        boton.disabled = false;
        return;
      }
      cargarPedidos();
    });

    // ---------- Inicio ----------
    (async function () {
      const sesion = await db.auth.getSession();
      if (sesion.data && sesion.data.session) {
        mostrarPanel();
      } else {
        mostrarLogin();
      }
    })();
  </script>
</body>
</html>
